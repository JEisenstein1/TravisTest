name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main, claude/home-checkup-urine-reader-6k29pb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w web
        env:
          VITE_BASE: /TravisTest/
      # Home Checkup is a static app with no build step; serve it at /home-checkup/
      - run: cp -r home-checkup web/dist/home-checkup
      - uses: actions/configure-pages@v5
        with:
          enablement: enabled
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
